<div class="tasks-container">
  <div class="tasks-header">
    <h1>Task Management</h1>
    <p>Create, manage, and track your tasks efficiently</p>
  </div>

  <!-- Task Form Component with Output binding -->
  <app-task-form (taskAdded)="onTaskAdded($event)"></app-task-form>

  <!-- Filter Buttons -->
  <div class="filters">
    <button *ngFor="let filter of filters" [class.active]="currentFilter === filter.value"
      (click)="setFilter(filter.value)" class="filter-btn">
      {{ filter.label }}
    </button>
  </div>

  <!-- Task List using Pipe -->
  <div class="tasks-list">
    <div *ngIf="(tasks | taskFilter:currentFilter).length === 0" class="empty-state">
      <div class="empty-icon">📭</div>
      <h3>No tasks found</h3>
      <p>
        <span *ngIf="currentFilter === 'all'">Start by creating your first task!</span>
        <span *ngIf="currentFilter !== 'all'">No tasks match the selected filter.</span>
      </p>
    </div>

    <!-- Task Items with Input/Output bindings -->
    <app-task-item *ngFor="let task of tasks | taskFilter:currentFilter" [task]="task"
      (toggleStatus)="onToggleStatus($event)" (deleteTask)="onDeleteTask($event)"
      (editTask)="onEditTask($event)"></app-task-item>
  </div>

  <!-- Stats Section -->
  <div class="stats">
    <div class="stat-card">
      <div class="stat-value">{{ tasks.length }}</div>
      <div class="stat-label">Total Tasks</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ (tasks | taskFilter:'active').length }}</div>
      <div class="stat-label">Active</div>
    </div>
    <div class="stat-card">
      <div class="stat-value">{{ (tasks | taskFilter:'completed').length }}</div>
      <div class="stat-label">Completed</div>
    </div>
  </div>
</div>
