<div class="container">
  <h1>My Tasks</h1>

  <button (click)="toggleForm()" class="add-btn">
    {{ showForm ? '✕ Cancel' : '+ Add Task' }}
  </button>

  <div *ngIf="showForm" class="form-card">
    <form (ngSubmit)="saveTask()">
      <div class="form-group">
        <label for="title">Title *</label>
        <input
          type="text"
          id="title"
          [(ngModel)]="taskTitle"
          name="title"
          placeholder="Enter task title"
          required
        />
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          [(ngModel)]="taskDescription"
          name="description"
          placeholder="Enter task description"
          rows="3"
        ></textarea>
      </div>

      <button type="submit" [disabled]="!taskTitle.trim()" class="save-btn">Save Task</button>
    </form>
  </div>

  <div class="task-list" *ngIf="tasks$ | async as tasks">
    <div *ngIf="tasks.length === 0" class="empty">
      <p>No tasks yet. Click "Add Task" to create one!</p>
    </div>

    <div *ngFor="let task of tasks" class="task-item">
      <div class="task-content">
        <h3 [class.completed]="task.completed">{{ task.title }}</h3>
        <p *ngIf="task.description">{{ task.description }}</p>
      </div>
      <div class="task-actions">
        <button (click)="toggleComplete(task.id)" [class.done]="task.completed">
          {{ task.completed ? '✓' : '○' }}
        </button>
        <button (click)="deleteTask(task.id)" class="delete-btn">✕</button>
      </div>
    </div>
  </div>
</div>
